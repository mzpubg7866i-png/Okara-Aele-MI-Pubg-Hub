<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okara Aele×MI Pubg Hub - User Profile & Auth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1a24;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2a2a3a;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            color: #f39c12;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #cccccc;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333348;
            background-color: #252533;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #f39c12;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e67e22;
        }
        .toggle-text {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .toggle-text span {
            color: #00d2d3;
            cursor: pointer;
            font-weight: bold;
        }
        /* Profile Section */
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #f39c12;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        .profile-info {
            background: #252533;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: right;
        }
        .profile-info p {
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #ddd;
        }
        .profile-info strong {
            color: #f39c12;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- SIGNUP FORM -->
    <div id="signup-box" class="card">
        <h2>اکاؤنٹ بنائیں۔ (Sign Up)</h2>
        <form id="signup-form">
            <div class="input-group">
                <label>پورا نام (Full Name)</label>
                <input type="text" id="signup-name" placeholder="اپنا نام درج کریں" required>
            </div>
            <div class="input-group">
                <label>موبائل نمبر (Mobile Number)</label>
                <input type="tel" id="signup-phone" placeholder="03001234567" required>
            </div>
            <div class="input-group">
                <label>ای میل (Email Address)</label>
                <input type="email" id="signup-email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>پاس ورڈ (Password)</label>
                <input type="password" id="signup-password" placeholder="پاس ورڈ بنائیں" required>
            </div>
            <button type="submit" class="btn">سائن اپ کریں</button>
        </form>
        <p class="toggle-text">پہلے سے اکاؤنٹ موجود ہے؟ <span onclick="showLogin()">لاگ ان کریں</span></p>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-box" class="card hidden">
        <h2>لاگ ان کریں (Login)</h2>
        <form id="login-form">
            <div class="input-group">
                <label>ای میل (Email Address)</label>
                <input type="email" id="login-email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>پاس ورڈ (Password)</label>
                <input type="password" id="login-password" placeholder="پاس ورڈ درج کریں" required>
            </div>
            <button type="submit" class="btn">لاگ ان</button>
        </form>
        <p class="toggle-text">نیا اکاؤنٹ بنانا چاہتے ہیں؟ <span onclick="showSignup()">سائن اپ کریں</span></p>
    </div>

    <!-- PROFILE SECTION -->
    <div id="profile-box" class="card hidden">
        <div class="profile-avatar" id="avatar-initial">U</div>
        <h2 id="profile-display-name">صارف کا نام</h2>
        
        <div class="profile-info">
            <p><strong>نام:</strong> <span id="info-name">-</span></p>
            <p><strong>موبائل نمبر:</strong> <span id="info-phone">-</span></p>
            <p><strong>ای میل:</strong> <span id="info-email">-</span></p>
        </div>

        <button class="btn" style="background-color: #e74c3c; color: white;" onclick="logout()">لاگ آؤٹ کریں</button>
    </div>

    <script>
        const signupBox = document.getElementById('signup-box');
        const loginBox = document.getElementById('login-box');
        const profileBox = document.getElementById('profile-box');

        function showLogin() {
            signupBox.classList.add('hidden');
            loginBox.classList.remove('hidden');
        }

        function showSignup() {
            loginBox.classList.add('hidden');
            signupBox.classList.remove('hidden');
        }

        // Sign Up Event
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const userData = {
                name: document.getElementById('signup-name').value,
                phone: document.getElementById('signup-phone').value,
                email: document.getElementById('signup-email').value,
                password: document.getElementById('signup-password').value
            };
            
            localStorage.setItem('userAccount', JSON.stringify(userData));
            alert('اکاؤنٹ کامیابی سے بن گیا ہے!');
            loadProfile(userData);
        });

        // Login Event
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const storedUser = JSON.parse(localStorage.getItem('userAccount'));
            const inputEmail = document.getElementById('login-email').value;
            const inputPass = document.getElementById('login-password').value;

            if (storedUser && storedUser.email === inputEmail && storedUser.password === inputPass) {
                loadProfile(storedUser);
            } else {
                alert('غلط ای میل یا پاس ورڈ!');
            }
        });

        function loadProfile(user) {
            signupBox.classList.add('hidden');
            loginBox.classList.add('hidden');
            profileBox.classList.remove('hidden');

            document.getElementById('profile-display-name').innerText = user.name;
            document.getElementById('info-name').innerText = user.name;
            document.getElementById('info-phone').innerText = user.phone;
            document.getElementById('info-email').innerText = user.email;
            document.getElementById('avatar-initial').innerText = user.name.charAt(0).toUpperCase();
        }

        function logout() {
            profileBox.classList.add('hidden');
            loginBox.classList.remove('hidden');
        }

        // Check active session
        window.onload = function() {
            const storedUser = JSON.parse(localStorage.getItem('userAccount'));
            if (storedUser) {
                loadProfile(storedUser);
            }
        };
    </script>
</body>
</html>
