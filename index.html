<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okara Aele×MI Pubg Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        h1 {
            color: #f39c12;
            margin-bottom: 20px;
        }
        .auth-box {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #444;
        }
        .auth-box input {
            width: 80%;
            max-width: 300px;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            text-align: center;
        }
        .auth-box button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login { background-color: #2980b9; color: white; }
        .btn-signup { background-color: #8e44ad; color: white; }
        .btn-logout { background-color: #e74c3c; color: white; display: none; margin: 10px auto; }
        .user-status {
            margin-top: 10px;
            font-size: 14px;
            color: #2ecc71;
        }
        .section-title {
            color: #e67e22;
            margin-top: 30px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #219150; }
        .btn-sell { background-color: #c0392b; }
        .btn-sell:hover { background-color: #a93226; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Okara Aele×MI Pubg Hub</h1>

        <!-- Account Auth Section -->
        <div class="auth-box">
            <h2 style="color: #3498db; margin-bottom: 15px;">Account Login</h2>
            <div id="auth-form">
                <input type="email" id="email" placeholder="Email"><br>
                <input type="password" id="password" placeholder="Password"><br>
                <button class="auth-box button btn-login" id="btn-login-action">Login</button>
                <button class="auth-box button btn-signup" id="btn-signup-action">Sign Up</button>
            </div>
            <p id="user-status" class="user-status"></p>
            <button id="btn-logout" class="auth-box button btn-logout">Logout</button>
        </div>

        <h2 class="section-title">PUBG Mobile Accounts</h2>
        <div class="btn-group">
            <a href="https://wa.me/923484742060?text=Hi,%20I%20want%20to%20Buy%20a%20PUBG%20Account" class="btn" target="_blank">Buy Account</a>
            <a href="https://wa.me/923484742060?text=Hi,%20I%20want%20to%20Sell%20my%20PUBG%20Account" class="btn btn-sell" target="_blank">Sell Account</a>
        </div>

        <h2 class="section-title">UC Top-Up</h2>
        <div class="btn-group">
            <a href="https://wa.me/923484742060?text=Hi,%20I%20want%20to%20Buy%20UC" class="btn" target="_blank">Buy UC</a>
            <a href="https://wa.me/923484742060?text=Hi,%20I%20want%20to%20Sell%20UC" class="btn btn-sell" target="_blank">Sell UC</a>
        </div>

        <h2 class="section-title">PUBG Popularity</h2>
        <div class="btn-group">
            <a href="https://wa.me/923484742060?text=Hi,%20I%20want%20to%20Buy%20Popularity" class="btn" target="_blank">Buy Popularity</a>
            <a href="https://wa.me/923484742060?text=Hi,%20I%20want%20to%20Sell%20Popularity" class="btn btn-sell" target="_blank">Sell Popularity</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8zgZaUoB9K1h_Ocr-Z0DzNsAfVYF9MGA",
            authDomain: "okara-aele.firebaseapp.com",
            projectId: "okara-aele",
            storageBucket: "okara-aele.firebasestorage.app",
            messagingSenderId: "679499860502",
            appId: "1:679499860502:web:548fb2ac116edb4a83c337",
            measurementId: "G-WJVKVW7MGP"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btn-login-action');
        const btnSignUp = document.getElementById('btn-signup-action');
        const btnLogout = document.getElementById('btn-logout');
        const authForm = document.getElementById('auth-form');
        const userStatus = document.getElementById('user-status');

        btnSignUp.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            createUserWithEmailAndPassword(auth, email, password)
                .catch(error => alert(error.message));
        });

        btnLogin.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            signInWithEmailAndPassword(auth, email, password)
                .catch(error => alert(error.message));
        });

        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, user => {
            if (user) {
                authForm.style.display = 'none';
                userStatus.textContent = "Logged in as: " + user.email;
                btnLogout.style.display = 'block';
            } else {
                authForm.style.display = 'block';
                userStatus.textContent = '';
                btnLogout.style.display = 'none';
            }
        });
    </script>
</body>
</html>
