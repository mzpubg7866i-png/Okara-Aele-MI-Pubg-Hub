<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okara Aele x MI PUBG Hub</title>
    <style>
        :root {
            --bg-dark: #0f141a;
            --card-bg: #1a232e;
            --accent-gold: #ffb703;
            --accent-violet: #8a2be2;
            --text-light: #f1f5f9;
            --border-color: #2a3744;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        .header h1 {
            margin: 0;
            color: var(--accent-gold);
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-top: 0;
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-violet);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: var(--text-light);
            box-sizing: border-box;
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--accent-violet), #6a0dad);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.7);
        }

        .post-item {
            background-color: var(--bg-dark);
            border-left: 4px solid var(--accent-gold);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-details {
            font-size: 1.1rem;
        }

        .post-price {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Okara Aele x MI PUBG Hub</h1>
    </div>

    <div class="container">
        <!-- User Post Form Section -->
        <div class="card">
            <h2>Add New Post</h2>
            <form id="ucPostForm">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="UC Top-Up">UC Top-Up</option>
                        <option value="PUBG Account">PUBG Account</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ucAmount">UC Amount</label>
                    <input type="number" id="ucAmount" placeholder="e.g. 660" required>
                </div>

                <div class="form-group">
                    <label for="price">Your Price (PKR / USD)</label>
                    <input type="text" id="price" placeholder="e.g. 1500 PKR" required>
                </div>

                <button type="submit" class="btn-submit">Post Listing</button>
            </form>
        </div>

        <!-- Dynamic Feed Section -->
        <div class="card">
            <h2>Live Listings</h2>
            <div id="listingsFeed">
                <div class="post-item">
                    <div class="post-details">
                        <strong>UC Top-Up:</strong> 600 + 60 UC
                    </div>
                    <div class="post-price">1,800 PKR</div>
                </div>
                <div class="post-item">
                    <div class="post-details">
                        <strong>UC Top-Up:</strong> 3000 + 850 UC
                    </div>
                    <div class="post-price">8,500 PKR</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
